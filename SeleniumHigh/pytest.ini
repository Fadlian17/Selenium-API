[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/test_report.json
    --cov=.
    --cov-report=html:reports/coverage
    --cov-report=term-missing
    --cov-fail-under=80

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    visual: marks tests as visual regression tests
    api: marks tests as API tests
    mobile: marks tests as mobile tests
    performance: marks tests as performance tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    unit: marks tests as unit tests
    ui: marks tests as UI tests
    database: marks tests that require database
    external: marks tests that require external services

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Timeout
timeout = 300

# Parallel execution
# Use: pytest -n auto or pytest -n 4
# Requires: pip install pytest-xdist

# Rerun failed tests
# Use: pytest --reruns 3
# Requires: pip install pytest-rerunfailures

# Test ordering
# Use: pytest --ff (failed first) or pytest --lf (last failed)
# Requires: pip install pytest-xdist

# Environment variables
env =
    SELENIUM_ENV=development
    SELENIUM_BROWSER=chrome
    SELENIUM_HEADLESS=false
    SELENIUM_TIMEOUT=30
    SELENIUM_WORKERS=4

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Custom options
# Use: pytest --browser=firefox
# Use: pytest --headless
# Use: pytest --mobile
# Use: pytest --api-only
# Use: pytest --ui-only 